<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>BzsOIDC</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="/_content/Bzs.Blazor/bzs.blazor.css" />
</head>
<body>
    <div id="app">
    <div id="blazor-loading" role="status" aria-live="polite" aria-atomic="true">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading BzsOIDC…</span>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet hidden role="alert" aria-live="assertive">
        <span id="blazor-error-message">BzsOIDC is taking longer than expected to start.</span>
        <button type="button" class="reload" id="blazor-reload">Reload</button>
    </div>

    <script src="/_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="/client-bootstrap.js"></script>
</body>
</html>
